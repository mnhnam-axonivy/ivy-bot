<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component" xmlns:p="http://primefaces.org/ui">

<h:body>
  <ui:composition template="/layouts/frame-10-full-width.xhtml">
    <ui:define name="title">
      <ui:insert name="page-title">#{ivy.cms.co('/Dialogs/procurement/request/layouts/ProcurementLayout/PageTitle')}</ui:insert>
    </ui:define>

    <ui:define name="content">

      <h:outputStylesheet library="css" name="procurement-layout.css" />

      <!-- ── Two-column body: form on left, AI assistant panel on right ── -->
      <div class="pr-body-columns">

        <!-- Form column + sticky footer wrapped in one form -->
        <h:form id="form" styleClass="pr-page-content flex flex-column">
          <p:messages id="form-messages" globalOnly="false" showDetail="true" closable="true" />
          <div class="pr-main flex-1">
            <ui:insert name="form-content">
              <!-- page overrides this slot -->
            </ui:insert>
          </div>

          <!-- ── Sticky footer ── -->
          <div class="pr-page-footer">
            <div class="pr-footer-left">
              <ui:insert name="footer-left" />
            </div>
            <h:panelGroup layout="block" id="footer-right-panel" styleClass="pr-footer-right">
              <ui:insert name="footer-right" />
            </h:panelGroup>
          </div>
        </h:form>

        <!-- Resize handle -->
        <div class="pr-resize-handle" id="pr-resize-handle"></div>

        <!-- AI Assistant panel — kept outside the main form to avoid nested forms -->
        <div class="pr-ai-panel" id="pr-ai-panel">
          <ic:procurement.request.components.AiAssistant
            id="pr-ai-assistant-active"
            agentEnabled="true"
            sendMessageListener="#{createRequestBean.sendAgentMessage}"
            getAnswerListener="#{createRequestBean.getAgentAnswer}"
            chatHistory="#{createRequestBean.agentChatHistory}"
            userMessage="#{createRequestBean.agentUserMessage}"
            guidanceList="#{createRequestBean.agentGuidance}"
            uploadEnabled="#{createRequestBean.assistantUploadEnabled}"
            uploadListener="#{createRequestBean.addUploadedDocument}"
            confirmParseListener="#{createRequestBean.confirmAssistantDocumentParse}"
            uploadedFileName="#{createRequestBean.assistantUploadedFileName}"
            awaitingConfirmation="#{createRequestBean.assistantAwaitingConfirmation}"
            parseFeedback="#{createRequestBean.assistantParseFeedback}"
            uploadedDocuments="#{createRequestBean.uploadedDocuments}"
            removeDocumentListener="#{createRequestBean.removeUploadedDocument}"
            updateAfterAnswer="#{p:resolveFirstComponentWithId('form', view).clientId}" />
        </div>

      </div>

      <script>
        (function () {
          function initPanelResize() {
            var handle = document.getElementById('pr-resize-handle');
            var panel  = document.getElementById('pr-ai-panel');
            if (!handle || !panel) return;

            var MIN_W = 350, MAX_W = 600;
            var startX, startW;

            handle.addEventListener('mousedown', function (e) {
              startX = e.clientX;
              startW = panel.offsetWidth;
              handle.classList.add('pr-dragging');
              document.body.style.cursor    = 'col-resize';
              document.body.style.userSelect = 'none';

              function onMove(e) {
                var delta = startX - e.clientX;
                var w = Math.min(MAX_W, Math.max(MIN_W, startW + delta));
                panel.style.width = w + 'px';
                panel.style.flex  = '0 0 ' + w + 'px';
              }

              function onUp() {
                handle.classList.remove('pr-dragging');
                document.body.style.cursor    = '';
                document.body.style.userSelect = '';
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup',   onUp);
              }

              document.addEventListener('mousemove', onMove);
              document.addEventListener('mouseup',   onUp);
              e.preventDefault();
            });
          }

          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPanelResize);
          } else {
            initPanelResize();
          }
        })();
      </script>

    </ui:define>
  </ui:composition>
</h:body>
</html>
