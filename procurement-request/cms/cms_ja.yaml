KnowledgeBase:
  procurement:
    ProcurementRequest: |
      # 資材調達依頼 — 業務プロセスナレッジベース

      ## プロセス概要
      資材調達依頼プロセスは、建設プロジェクトチームが正式に資材を申請することを可能にします。
      このプロセスは構造化された2段階のワークフローに従います：申請者が申請フォームを提出し、購買マネージャーがレビューして承認または却下します。
      すべての申請はライフサイクル全体を通じてステータスで追跡されます。

      ## ワークフロー手順

      ### 手順1：調達依頼の記入（申請者）
      申請者は資材調達依頼フォームに必要な資材、数量、プロジェクトのコンテキスト、理由などの詳細を記入して完成させます。
      提出後、依頼のステータスはSUBMITTED（提出済み）に設定され、レコードがシステムに保存されます。
      ケースには、下流の追跡のために調達依頼IDがタグ付けされます。

      ### 手順2：調達依頼のレビュー（購買マネージャー）
      購買マネージャーは提出された依頼をレビューするタスクを受け取ります。
      依頼の詳細を確認し、次のいずれかの決定を行います：
      - APPROVED（承認）：依頼が承認され、APPROVEDとしてマークされます。
      - REJECTED（却下）：依頼が却下され、REJECTEDとしてマークされます。
      購買マネージャーは、決定の理由を記録するために承認コメントを追加することもできます。

      ## 依頼ステータス
      - SUBMITTED（提出済み）：申請者によってフォームが記入・提出され、レビュー待ちの状態です。
      - APPROVED（承認済み）：購買マネージャーが調達依頼を承認しました。
      - REJECTED（却下済み）：購買マネージャーが調達依頼を却下しました。

      ---

      ## よくある質問と回答

      Q: 資材調達依頼を提出できるのは誰ですか？
      A: 申請者ロールに割り当てられたチームメンバーは誰でも、システムを通じて資材調達依頼を開始・提出できます。

      Q: 依頼を提出する際に必要な情報は何ですか？
      A: 依頼フォームには、必要な資材の詳細、数量、関連する建設プロジェクト、および調達の理由が必要です。

      Q: 依頼のレビューを担当するのは誰ですか？
      A: 購買マネージャーが、すべての調達依頼のレビュー、承認、または却下に独占的に責任を負います。

      Q: 依頼がレビューされたことをどのように知ることができますか？
      A: 購買マネージャーがレビューを完了すると、依頼のステータスがAPPROVEDまたはREJECTEDに更新されます。システムでいつでもステータスを追跡できます。

      Q: 提出後に依頼を修正できますか？
      A: 依頼が提出されるとステータスがSUBMITTEDに設定され、編集できなくなります。修正が必要な場合は、購買マネージャーに直接連絡してください。

      Q: 依頼が承認された後はどうなりますか？
      A: APPROVEDステータスは、資材調達を進める権限が確認されたことを示します。調達チームが資材の調達を調整します。

      Q: 依頼が却下された場合はどうすればよいですか？
      A: 却下された依頼には、購買マネージャーからの却下理由を説明するコメントが含まれています。コメントを確認し、懸念事項に対処して、必要な調整を加えた新しい依頼を提出してください。

      Q: 購買マネージャーは決定にコメントを追加できますか？
      A: はい。購買マネージャーは依頼をレビューする際に、理由を記録したり申請者にガイダンスを提供するための承認コメントを記載できます。

      Q: 調達依頼はシステムでどのように識別されますか？
      A: 各調達依頼は作成時に一意のIDが割り当てられます。このIDはケースのカスタムフィールド（procurementRequestId）として保存され、ワークフロー手順全体にわたって依頼をリンクするために使用されます。

      Q: 調達依頼の典型的なフローは何ですか？
      A: プロセスは申請者がフォームを提出することから始まります（ステータス：SUBMITTED）。その後、ケースはレビューのために購買マネージャーに割り当てられます。マネージャーが依頼を承認または却下し（ステータス：APPROVEDまたはREJECTED）、ワークフローが完了します。

